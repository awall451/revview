# Reference options for the wheel buttons. FROM MEMORY, NOT CHECKED AGAINST THE ZMK DOCS, UNTESTED.
# Option names, units and defaults may be wrong or out of date for the ZMK version you build.
# Which options go in which file (dongle build or pod build) depends on your board and shield setup.

# --- dongle (split central, USB keyboard to the Pi) ---
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
# Two peripherals (the two pods).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
# The dongle is powered by the Pi: never sleep.
# (sleep is off here; the pod section below turns it on. Use two separate .conf files in a real build.)
# CONFIG_ZMK_SLEEP=n
# USB ids: ZMK's defaults are 1d50:615e (from memory). Keep them, or set your own and update
# config/buttons.json and pi/70-revview-dongle.rules to match (bench D5).
# CONFIG_USB_DEVICE_VID=0x1D50
# CONFIG_USB_DEVICE_PID=0x615E

# --- pods (split peripheral, coin cell) ---
# CONFIG_ZMK_SPLIT_ROLE_CENTRAL is not set on the pods.
CONFIG_ZMK_SLEEP=y
# Deep sleep after 15 minutes without a key (milliseconds). A key press wakes the pod
# (the key pins must be wake-up sources in the devicetree). Bench 29 and D8 test a longer wait.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Nothing to light or draw on a coin cell.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_DISPLAY=n
# Lower radio power saves battery, higher gives range in the car (bench D11). Untested value.
# CONFIG_BT_CTLR_TX_PWR_0=y
# Connection interval in units of 1.25 ms: 12 is 15 ms. Larger saves battery, adds latency (bench D10).
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# --- keys: plain presses only ---
# Debounce is also done on the Pi (30 ms, config/buttons.json), so keep the firmware's short.
# No auto-repeat is sent by ZMK for a held key (HID reports keep the key down); the kernel may add
# its own repeat lines (value 2), which the Pi ignores (bench 28 and D6).
